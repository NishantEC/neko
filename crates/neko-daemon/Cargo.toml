[package]
name = "neko-daemon"
description = "Neko's daemon: owns the data folder and serves the protocol to screens on this machine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "neko-daemon"
path = "src/main.rs"

[dependencies]
neko-protocol = { workspace = true, features = ["ws"] }
neko-core.workspace = true
serde_json.workspace = true
tungstenite.workspace = true
httparse.workspace = true
libc.workspace = true

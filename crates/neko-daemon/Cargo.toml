[package]
name = "neko-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "neko-daemon"
path = "src/main.rs"

# Hosts the real `server` module against a /tmp data dir for the web UI's
# self-verification loop (scripts/web-verify.mjs). Its tests would only repeat
# the daemon's own, so they are not built twice.
[[bin]]
name = "web_harness"
path = "src/bin/web_harness.rs"
test = false

[dependencies]
libc = "0.2"
neko-protocol.workspace = true
neko-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

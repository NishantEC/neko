[package]
name = "neko-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neko-protocol.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
plist = "1"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSData", "NSArray", "NSDictionary"] }

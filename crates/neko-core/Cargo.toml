[package]
name = "neko-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neko-protocol.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
plist = "1"
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
libc = "0.2"
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "transport-io", "client", "auth", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
async-trait = "0.1"
tracing = "0.1"
tokio = { version = "1", features = ["io-std", "rt", "process", "time", "io-util", "macros"] }
reqwest-mcp = { package = "reqwest", version = "0.13.2", default-features = false, features = ["rustls"] }
sha2 = "0.10"
futures = "0.3"
sse-stream = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
# Already in the lock tree via gpui at this exact version, so this adds no
# new crate versions — the same test `agents.rs` needs it for is the one
# that must never read the real `~/.paseo`.
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSPasteboard", "NSRunningApplication", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSData", "NSArray", "NSDictionary"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFRunLoop", "CFDate"] }

# Its own workspace root: the GPUI fork (and the local patch on it) is needed
# only here. The installed app is the SwiftUI client and never links this.
[workspace]

# Fixes a real ~30ms warm-summon regression in the pinned gpui fork rev (see
# `patches/gpui-0001-*.patch`): an inactive-window frame throttle with no
# exemption for a pending `on_next_frame` callback, not present in any
# published gpui release. Run `scripts/setup-gpui-patch.sh` once to populate
# `.gpui-fork-patched/` (gitignored, beside the repository's root Cargo.toml).
[patch."https://github.com/wingleeio/zed"]
gpui = { path = "../../.gpui-fork-patched/crates/gpui" }
gpui_platform = { path = "../../.gpui-fork-patched/crates/gpui_platform" }

[package]
name = "neko"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "neko"
path = "src/main.rs"

[dependencies]
libc = "0.2"
neko-protocol = { path = "../neko-protocol" }
neko-client = { path = "../neko-client" }
serde_json = "1"
# `wingleeio/zed` fork, pinned by rev (never a branch — see `AGENTS.md`, "The
# GPUI dependency decision" for the full record of this reversal and its
# licence consequence). Rev matches exactly what comet pins
# (`refs/comet/Cargo.toml`), so the primitives this migration was
# taken for are known to exist at this exact commit.
gpui = { git = "https://github.com/wingleeio/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a" }
# The mac platform backend is its own crate at this rev — `gpui::Application::new()`
# no longer exists; every real entry point in this fork (its own examples,
# `zed` itself) bootstraps through `gpui_platform::application()` instead
# (`crates/gpui_platform/src/gpui_platform.rs`, which internally selects
# `gpui_macos::MacPlatform` on macOS). `wayland`/`x11` are no-ops on macOS
# (they only gate `gpui_linux`, not present in this dependency graph on this
# target) but kept to mirror comet's own feature set exactly rather than
# introduce an untested configuration; `font-kit` matches `gpui`'s own
# default features (real system font rendering); `runtime_shaders` stitches
# Metal shaders for runtime compilation instead of `xcrun metal` at build
# time, comet's own choice.
gpui_platform = { git = "https://github.com/wingleeio/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
global-hotkey = "0.8.0"
# `.shared()` on the background-executor task in `row_icon_cache.rs`, the
# same call gpui's own `RetainAllImageCache`/`SimpleLruCache` make — already
# a transitive dependency of `gpui` at this exact version, so this adds zero
# new crate versions to the tree. MIT OR Apache-2.0.
futures = "0.3"
# Unicode-aware word-boundary segmentation for `text_field.rs`'s ⌥←/⌥→/
# ⌥⌫/⌥⌦ word navigation — already a transitive dependency (via
# `global-hotkey` -> `keyboard-types`) at this exact version, so this adds
# zero new crate versions to the tree. MIT OR Apache-2.0.
unicode-segmentation = "1.13"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.1"
core-foundation = "0.9"
# Window material (see `src/material.rs`) — all four already transitive
# dependencies of `gpui`/`neko-core` at these exact versions, so this adds
# zero new crate versions to the tree (verified: `cargo tree` before/after,
# `docs/evidence/cargo-tree.txt`).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSView",
    "NSWindow",
    "NSResponder",
    "NSGraphics",
    "NSVisualEffectView",
    # The menu bar item that replaced the Dock icon — see `crate::menu_bar`.
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    # Its right-click menu (Summon / Preferences / Quit) — an accessory app
    # has no Dock icon and no ⌘Tab entry, so without this there is no
    # discoverable way to quit or reach Preferences with the panel hidden.
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSButton",
    "NSControl",
    "NSImage",
    "NSCell",
    "NSApplication",
    "NSGlassEffectView",
    "NSScreen",
    "NSEvent",
    # `motion.rs`'s reduced-motion read (`NSWorkspace.
    # accessibilityDisplayShouldReduceMotion`) — already a transitive
    # dependency of `objc2-app-kit` at this exact version, so enabling the
    # feature adds zero new crate versions to the tree, same reasoning as
    # the rest of this block.
    "NSWorkspace",
    # `pasteboard.rs`'s ⌘C/⌘X/⌘V read/write — already a transitive
    # dependency of `objc2-app-kit` at this exact version (`neko-core`
    # already enables it for the daemon's own clipboard-history capture),
    # so this adds zero new crate versions to the tree, same reasoning as
    # the rest of this block.
    "NSPasteboard",
    # Drawing the mark for the status item — see `menu_bar::mark_image`.
    # `NSBitmapImageRep` + `NSGraphicsContext` rather than `lockFocus`,
    # which is deprecated *because* it cannot draw resolution-independently
    # — the same reason `neko_core::icons` avoids it.
    "NSColor",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSGraphicsContext",
] }
# Window-under-cursor multi-display placement (`src/display_placement.rs`)
# needs `NSPoint`/`NSRect` directly to build the `setFrameTopLeftPoint:`
# argument — already a transitive dependency of `objc2-app-kit` at this
# exact version (verified via `Cargo.lock`), so this adds zero new crate
# versions to the tree, same reasoning as the rest of this block.
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSArray", "NSString", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
raw-window-handle = "0.6"

[dev-dependencies]
# Same `gpui` dependency above, `test-support` feature only for `cargo
# test`. `#[gpui::test]` builds its own headless `TestAppContext` entirely
# inside the `gpui` crate itself (confirmed by reading
# `crates/gpui_macros/src/test.rs` at the pinned rev — it calls
# `gpui::TestAppContext::build` directly, never `gpui_platform`), so no
# `gpui_platform` dev-dependency is needed for the test suite.
gpui = { git = "https://github.com/wingleeio/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a", features = [
    "test-support",
] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = false

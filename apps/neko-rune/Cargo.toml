# Neko's native UI on Rune (docs/decisions/0002-rune-for-everything.md). Its own Cargo workspace:
# Rune needs the `[patch.crates-io]` table below, which must not reach the daemon's workspace
# (the root `Cargo.toml` never lists this folder, and the installer never builds it).
#
# Rune is pinned by git rev. The rev is written on every `rev =` line below and in `RUNE_REV`;
# change it only through `scripts/bump-rune.sh`, which also checks that the patch table still
# matches the one in Rune's own root `Cargo.toml`.
[workspace]
resolver = "2"
members = ["."]

[package]
name = "neko-rune"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Neko's native client on the Rune UI framework (beside the web UI until each screen reaches parity)."

[lib]
name = "neko_rune"
path = "src/lib.rs"

[[bin]]
name = "neko-rune"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75", features = ["tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75", features = ["markdown"] }
# Native plugins (docs/knowledge/luau-plugins.md): Luau in a sandbox (250 ms an entry, 64 MB, no io/os/net). `serde` is `Data::to_json`.
# Its Luau VM is `mlua` (MIT) with Luau (MIT), built from C++ by `cargo`; no other crate comes with it.
rune-luau = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75", features = ["serde"] }
# The wire types and framing, shared with the daemon: the only thing this client knows of it.
neko-protocol = { path = "../../crates/neko-protocol" }
# Fuzzy matching for the ⌘K palette (docs/research/reuse-for-rune-2026-11.md: MIT).
frizbee = "0.13"
serde_json = "1"
# Local time (`localtime_r`, `mktime`) for the Calendar: `src/clock.rs`.
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
# The context panel (P3a, docs/knowledge/rune-p3a-the-context-panel.md). Every crate here is MIT or Apache-2.0
# (docs/research/reuse-for-rune-2026-11.md); resvg is MPL-2.0, as an unmodified dependency, and is the same
# version Rune itself pins (one copy in the tree).
# The terminal tab's output, as a terminal draws it (colours, cursor moves).
vt100 = "0.15"
# Images, GIF frames, SVG, CSV, PDF and 3D formats for the viewers.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
gif = "0.14"
resvg = { version = "0.45", default-features = false }
csv = "1"
hayro = "0.9"
gltf = { version = "1", default-features = false, features = ["utils", "import"] }
stl_io = "0.8"
tobj = "4"
glam = "0.29"
# The 3D viewer draws on Rune's own wgpu device (same version and features as Rune).
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }

# The web view for HTML artifacts, Excalidraw and plugins' pages (P3b, `src/web_panel.rs`): `wry` (Apache-2.0 or
# MIT) builds a WKWebView as a child of the Rune window. Nothing else of Tauri comes with it.
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
# Addresses are parsed, never string-matched, by the web view's navigation lock (`src/web_panel.rs`).
url = "2"
# The live Browser tab (`src/browser/`): one websocket to a Chrome on this Mac, ws:// to loopback only, so no TLS feature and no
# async runtime (MIT or Apache-2.0). `base64` (already in the tree, 0.22) decodes the screencast's JPEG frames.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
base64 = "0.22"

# The Dock badge (`src/dock.rs`): NSApp.dockTile through objc2, the versions Rune already builds (no new crate in the tree).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder", "NSScreen", "NSEvent", "NSRunningApplication", "libc", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSImage", "NSImageRep", "NSButton", "NSControl", "NSCell", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSArray", "NSData", "NSObject"] }

[dev-dependencies]
png = "0.17"

[profile.release]
codegen-units = 16
incremental = true

[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false

# Cargo does not inherit a dependency's patches. This is the table Rune's README requires, at the
# same rev as the dependencies above.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75" }
winit = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "bc05f817ed19488a10a6f1a928cc0521c1c70c75" }

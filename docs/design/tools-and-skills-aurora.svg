  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#23222b" stop-opacity=".93"/><stop offset="1" stop-color="#211b27" stop-opacity=".85"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9a4ff" stop-opacity=".78"/><stop offset=".48" stop-color="#eaa0b3" stop-opacity=".4"/><stop offset="1" stop-color="#8386a7" stop-opacity=".16"/></linearGradient>
  <linearGradient id="sel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#443c57" stop-opacity=".85"/><stop offset="1" stop-color="#342b3c" stop-opacity=".37"/></linearGradient>
  <radialGradient id="orchid"><stop stop-color="#a66bb3" stop-opacity=".74"/><stop offset=".52" stop-color="#945f9e" stop-opacity=".31"/><stop offset="1" stop-color="#945f9e" stop-opacity="0"/></radialGradient>
  <radialGradient id="rose"><stop stop-color="#ff9d80" stop-opacity=".67"/><stop offset=".54" stop-color="#df6b85" stop-opacity=".25"/><stop offset="1" stop-color="#df6b85" stop-opacity="0"/></radialGradient>
  <radialGradient id="sea"><stop stop-color="#628e9b" stop-opacity=".47"/><stop offset="1" stop-color="#628e9b" stop-opacity="0"/></radialGradient>
  <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffcba9"/><stop offset=".51" stop-color="#e7a6d0"/><stop offset="1" stop-color="#adaaff"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="27"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
  <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".32" fill="#fff" opacity=".2"/></pattern>
  <clipPath id="mainClip"><rect x="250" width="1350" height="990"/></clipPath>
  <style>
   text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;fill:#f5f1f5}.muted{fill:#a8a5b2}.dim{fill:#777783}.rose{fill:#e8aab5}.mint{fill:#a6d1bf}.small{font-size:14px}.tiny{font-size:12px}.body{font-size:16px}.medium{font-weight:560}.semi{font-weight:650}.title{font-size:32px;font-weight:660;letter-spacing:-.7px}.heroText{font-size:31px;font-weight:630;letter-spacing:-.8px}.section{font-size:20px;font-weight:630;letter-spacing:-.2px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
 </defs>

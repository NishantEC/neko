<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" role="img" aria-label="Luminous Neko Tools and skills concept with prismatic colors, asymmetrical connection shelf, and clear permissions table">
 <defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f5f1"/><stop offset="1" stop-color="#eeeff6"/></linearGradient>
  <radialGradient id="iris"><stop stop-color="#839bff" stop-opacity=".78"/><stop offset=".55" stop-color="#a7a8fa" stop-opacity=".34"/><stop offset="1" stop-color="#a7a8fa" stop-opacity="0"/></radialGradient>
  <radialGradient id="pink"><stop stop-color="#e9a7cf" stop-opacity=".65"/><stop offset=".53" stop-color="#f4c4d6" stop-opacity=".31"/><stop offset="1" stop-color="#f4c4d6" stop-opacity="0"/></radialGradient>
  <radialGradient id="sun"><stop stop-color="#f3c49d" stop-opacity=".56"/><stop offset=".57" stop-color="#f7d6b3" stop-opacity=".2"/><stop offset="1" stop-color="#f7d6b3" stop-opacity="0"/></radialGradient>
  <linearGradient id="aura" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1dfff"/><stop offset=".55" stop-color="#f3dcea"/><stop offset="1" stop-color="#ffe5d4"/></linearGradient>
  <linearGradient id="selected" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf9fe"/><stop offset="1" stop-color="#f3eaf9"/></linearGradient>
  <linearGradient id="button" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b62b0"/><stop offset="1" stop-color="#7464a4"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="44"/></filter>
  <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#6a6891" flood-opacity=".14"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".45" fill="#767aa0" opacity=".24"/></pattern>
  <clipPath id="clip"><rect x="250" width="1350" height="990"/></clipPath>
  <style>
   text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;fill:#272735}.muted{fill:#676878}.faint{fill:#9294a3}.violet{fill:#63569e}.green{fill:#3d7e69}.rose{fill:#a66981}.small{font-size:14px}.tiny{font-size:12px}.body{font-size:16px}.medium{font-weight:560}.semi{font-weight:650}.title{font-size:32px;font-weight:660;letter-spacing:-.8px}.big{font-size:29px;font-weight:640;letter-spacing:-.6px}.section{font-size:20px;font-weight:640;letter-spacing:-.2px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
 </defs>
 <rect width="1600" height="990" fill="url(#paper)"/>
 <g clip-path="url(#clip)">
  <ellipse cx="1255" cy="102" rx="390" ry="245" fill="url(#iris)" filter="url(#blur)"/>
  <ellipse cx="1446" cy="255" rx="330" ry="268" fill="url(#pink)" filter="url(#blur)"/>
  <ellipse cx="895" cy="215" rx="310" ry="255" fill="url(#sun)" filter="url(#blur)"/>
  <rect x="250" width="1350" height="990" fill="url(#dots)" opacity=".16"/>

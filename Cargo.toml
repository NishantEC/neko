[workspace]
resolver = "2"
members = [
    "crates/neko-protocol",
    "crates/neko-core",
    "crates/neko-daemon",
    "crates/neko-client",
    "crates/neko",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
neko-protocol = { path = "crates/neko-protocol" }
neko-core = { path = "crates/neko-core" }
neko-client = { path = "crates/neko-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0

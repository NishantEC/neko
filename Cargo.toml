[workspace]
resolver = "2"
members = [
    "crates/neko-protocol",
    "crates/neko-core",
    "crates/neko-daemon",
    "crates/neko-client",
]
# The optional GPUI client (`crates/neko`) is its own workspace, so a fresh
# clone builds the daemon and the app without fetching the GPUI fork.
# Build it with `scripts/setup-gpui-patch.sh` then
# `cargo build --manifest-path crates/neko/Cargo.toml --target-dir target`.
exclude = ["crates/neko", ".gpui-fork-patched"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
neko-protocol = { path = "crates/neko-protocol" }
neko-core = { path = "crates/neko-core" }
neko-client = { path = "crates/neko-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = false

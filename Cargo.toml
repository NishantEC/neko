# The daemon's workspace: the protocol, the core and the daemon binary.
# The desktop app (`apps/neko`) is its own workspace: Rune needs a `[patch.crates-io]` table that must not reach this one.
[workspace]
resolver = "3"
members = ["crates/neko-protocol", "crates/neko-core", "crates/neko-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
neko-protocol = { path = "crates/neko-protocol" }
neko-core = { path = "crates/neko-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
httparse = "1"
libc = "0.2"
security-framework = "3"

[profile.dev]
debug = "line-tables-only"

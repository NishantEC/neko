[workspace]
resolver = "2"
members = [
    "crates/neko-protocol",
    "crates/neko-core",
    "crates/neko-daemon",
    "crates/neko-client",
    "crates/neko",
]
# **The patched fork checkout is not part of this workspace.** It lives inside
# the repo so `[patch]` below can name it relatively, and without this Cargo
# absorbs it — the fork's own crates use `workspace = true` dependencies that
# then resolve against *our* workspace root instead of theirs, and the build
# fails with a missing workspace dependency.
exclude = [".gpui-fork-patched"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# This field describes every line written in this repo, which remains MIT —
# see `AGENTS.md`'s "Licence rule". It does NOT describe a distributed
# binary: `crates/neko` links the `wingleeio/zed` gpui fork, which pulls in
# GPL-3.0-or-later code unconditionally (`gpui -> sum_tree -> ztracing`, no
# feature gate) — see `AGENTS.md`'s "The GPUI dependency decision" for the
# full record, why a bare SPDX string can't express a linked-GPL obligation,
# and why the practical exposure is nil while neko stays local-only.
license = "MIT"

[workspace.dependencies]
neko-protocol = { path = "crates/neko-protocol" }
neko-core = { path = "crates/neko-core" }
neko-client = { path = "crates/neko-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0

# Fixes a real ~30ms warm-summon regression in the pinned gpui fork rev (see
# `AGENTS.md`'s "Summon latency" section and `patches/gpui-0001-*.patch`) —
# an inactive-window frame throttle with no exemption for a pending
# `on_next_frame` callback, not present in any published gpui release.
# `gpui`/`gpui_platform` are redirected to a local checkout of the exact
# pinned rev with that one small patch applied on top. Run
# `scripts/setup-gpui-patch.sh` once (or again after the pinned rev
# changes) to populate it — `cargo build` fails with a missing-path error
# until that has been run at least once.
#
# **Relative, because Cargo expands neither `~` nor environment variables
# here.** An absolute path is one machine's path, and this section held one
# for a long time — which meant a fresh clone could not build on anybody
# else's computer. `.gpui-fork-patched/` sits beside this file and is
# gitignored.
[patch."https://github.com/wingleeio/zed"]
gpui = { path = ".gpui-fork-patched/crates/gpui" }
gpui_platform = { path = ".gpui-fork-patched/crates/gpui_platform" }
